# Local stack: SQL Server + database scripts + API/website.
#   docker compose up --build      → open http://localhost:8080
# Set ANTHROPIC_API_KEY in a .env file next to this file to turn on Claude.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest   # use 2025-latest for the optional VECTOR features
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Passw0rd"
    ports: ["1433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Your_strong_Passw0rd' -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 12

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on: { sql: { condition: service_healthy } }
    volumes: ["./database:/scripts:ro"]
    entrypoint: >
      bash -c "
      /opt/mssql-tools18/bin/sqlcmd -C -S sql -U sa -P 'Your_strong_Passw0rd' -Q \"IF DB_ID('CollaborateBench') IS NULL CREATE DATABASE CollaborateBench\" &&
      /opt/mssql-tools18/bin/sqlcmd -C -S sql -U sa -P 'Your_strong_Passw0rd' -d CollaborateBench -Q \"IF OBJECT_ID('sec.Users') IS NULL SELECT 'init' ELSE RAISERROR('already initialised',16,1)\" &&
      /opt/mssql-tools18/bin/sqlcmd -C -S sql -U sa -P 'Your_strong_Passw0rd' -d CollaborateBench -b -i /scripts/01_schema.sql &&
      /opt/mssql-tools18/bin/sqlcmd -C -S sql -U sa -P 'Your_strong_Passw0rd' -d CollaborateBench -b -i /scripts/02_seed.sql
      || echo 'Init skipped: database already exists (or check the errors above)'"

  app:
    build: .
    depends_on: { db-init: { condition: service_completed_successfully } }
    ports: ["8080:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"          # enables demo passwords; use Production for real deployments
      ConnectionStrings__Sql: "Server=sql,1433;Database=CollaborateBench;User Id=sa;Password=Your_strong_Passw0rd;Encrypt=True;TrustServerCertificate=True"
      Jwt__Key: "change-this-local-secret-0123456789abcdef"
      Anthropic__ApiKey: "${ANTHROPIC_API_KEY:-}"
      Cors__Origins__0: "http://localhost:8080"
